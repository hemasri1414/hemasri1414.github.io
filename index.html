<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Hemasri K — CS & Business Systems Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet"/>
<style>
/* ── Variables ── */
:root {
  --bg:#ffffff; --bg2:#f8fafc; --bg3:#f1f5f9;
  --glass:rgba(255,255,255,0.72); --glass-border:rgba(124,58,237,0.18);
  --accent:#7c3aed; --accent2:#06b6d4; --accent3:#f59e0b;
  --txt:#0a0a0a; --txt2:#334155; --txt3:#64748b;
  --shadow:0 4px 32px rgba(124,58,237,0.10);
  --shadow-lg:0 16px 64px rgba(124,58,237,0.16);
  --radius:20px;
  --font-display:'Syne',sans-serif; --font-body:'DM Sans',sans-serif;
  --nav-h:72px; --transition:cubic-bezier(.22,.68,0,1.2);
}
[data-theme="dark"] {
  --bg:#080c14; --bg2:#0d1321; --bg3:#111827;
  --glass:rgba(13,19,33,0.80); --glass-border:rgba(124,58,237,0.30);
  --txt:#f0f4ff; --txt2:#c8d3e8; --txt3:#8896b3;
  --shadow:0 4px 32px rgba(124,58,237,0.22);
  --shadow-lg:0 16px 64px rgba(124,58,237,0.28);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:var(--font-body);background:var(--bg);color:var(--txt);overflow-x:hidden;transition:background .4s,color .4s;cursor:none;}
a{color:inherit;text-decoration:none;}
ul{list-style:none;}
button{cursor:none;font-family:var(--font-body);}

/* ── Cursor ── */
#cursor{position:fixed;top:0;left:0;width:14px;height:14px;border-radius:50%;background:var(--accent);pointer-events:none;z-index:99999;transform:translate(-50%,-50%);transition:width .2s,height .2s;mix-blend-mode:multiply;}
#cursor-ring{position:fixed;top:0;left:0;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--accent);pointer-events:none;z-index:99998;transform:translate(-50%,-50%);transition:width .25s,height .25s;opacity:.5;}
[data-theme="dark"] #cursor{mix-blend-mode:screen;}

/* ── Loader ── */
#loader{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .7s ease,visibility .7s ease;}
#loader.hidden{opacity:0;visibility:hidden;}
.loader-name{font-family:var(--font-display);font-size:clamp(2rem,6vw,4rem);font-weight:800;letter-spacing:-.02em;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;animation:pulse-txt 1.4s ease-in-out infinite;}
.loader-bar-wrap{width:200px;height:3px;background:var(--bg3);border-radius:9px;margin-top:28px;overflow:hidden;}
.loader-bar{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:9px;animation:load-fill 1.8s ease forwards;}
@keyframes load-fill{to{width:100%;}}
@keyframes pulse-txt{0%,100%{opacity:1}50%{opacity:.5}}

/* ── Scrollbar ── */
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-track{background:var(--bg2);}
::-webkit-scrollbar-thumb{background:var(--accent);border-radius:9px;}

/* ── Scroll to top ── */
#scroll-top{position:fixed;bottom:28px;right:28px;width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;display:flex;align-items:center;justify-content:center;font-size:1.2rem;box-shadow:0 4px 20px rgba(124,58,237,.4);z-index:500;opacity:0;transform:translateY(16px);transition:opacity .3s,transform .3s;}
#scroll-top.visible{opacity:1;transform:translateY(0);}
#scroll-top:hover{transform:translateY(-4px);box-shadow:0 8px 28px rgba(124,58,237,.55);}

/* ── Navbar ── */
nav{position:fixed;top:0;left:0;width:100%;z-index:1000;height:var(--nav-h);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(20px,5vw,60px);transition:background .3s,box-shadow .3s;}
nav.scrolled{background:var(--glass);backdrop-filter:blur(18px);box-shadow:0 1px 0 var(--glass-border);}
.nav-logo{font-family:var(--font-display);font-size:1.4rem;font-weight:800;letter-spacing:-.03em;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;}
.nav-links{display:flex;gap:2px;align-items:center;}
.nav-links a{padding:8px 14px;font-size:.88rem;font-weight:500;color:var(--txt2);border-radius:10px;transition:color .2s,background .2s;}
.nav-links a:hover{color:var(--accent);background:rgba(124,58,237,.07);}
.nav-right{display:flex;gap:10px;align-items:center;}
.theme-btn{width:40px;height:40px;border-radius:12px;border:1.5px solid var(--glass-border);background:var(--glass);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;font-size:1.1rem;color:var(--txt2);transition:all .2s;}
.theme-btn:hover{border-color:var(--accent);color:var(--accent);}
.btn-primary{padding:9px 20px;background:linear-gradient(135deg,var(--accent),#6d28d9);color:#fff!important;font-weight:600;font-size:.85rem;border-radius:12px;border:none;box-shadow:0 4px 16px rgba(124,58,237,.35);transition:transform .2s var(--transition),box-shadow .2s;display:inline-flex;align-items:center;gap:6px;}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(124,58,237,.45);}
.btn-outline{padding:9px 20px;background:transparent;color:var(--accent)!important;font-weight:600;font-size:.85rem;border-radius:12px;border:1.5px solid var(--accent);transition:transform .2s var(--transition),background .2s;display:inline-flex;align-items:center;gap:6px;}
.btn-outline:hover{background:rgba(124,58,237,.08);transform:translateY(-2px);}
.hamburger{display:none;flex-direction:column;gap:5px;width:38px;height:38px;border-radius:10px;border:1.5px solid var(--glass-border);background:var(--glass);backdrop-filter:blur(8px);align-items:center;justify-content:center;}
.hamburger span{display:block;width:18px;height:2px;background:var(--txt2);border-radius:2px;transition:all .3s;}
.mobile-menu{display:none;position:fixed;top:var(--nav-h);left:0;width:100%;background:var(--glass);backdrop-filter:blur(20px);padding:20px;flex-direction:column;gap:4px;border-bottom:1px solid var(--glass-border);z-index:999;}
.mobile-menu.open{display:flex;}
.mobile-menu a{padding:12px 16px;border-radius:12px;font-weight:500;color:var(--txt2);transition:background .2s,color .2s;}
.mobile-menu a:hover{background:rgba(124,58,237,.08);color:var(--accent);}

/* ── Hero ── */
#hero{min-height:100vh;display:flex;align-items:center;position:relative;overflow:hidden;padding-top:var(--nav-h);}

/* Animated gradient background — no orbit rings */
.hero-bg{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
.hero-bg-grad{
  position:absolute;inset:0;
  background:
    radial-gradient(ellipse 70% 60% at 75% 40%, rgba(124,58,237,.10) 0%, transparent 70%),
    radial-gradient(ellipse 55% 50% at 20% 70%, rgba(6,182,212,.07) 0%, transparent 65%),
    radial-gradient(ellipse 40% 40% at 60% 80%, rgba(167,139,250,.06) 0%, transparent 60%);
  animation:grad-shift 10s ease-in-out infinite alternate;
}
@keyframes grad-shift{
  0%{opacity:.8;transform:scale(1);}
  100%{opacity:1;transform:scale(1.04);}
}
/* Subtle dot grid */
.hero-bg-grid{
  position:absolute;inset:0;
  background-image:radial-gradient(circle, rgba(124,58,237,.09) 1px, transparent 1px);
  background-size:36px 36px;
  mask-image:radial-gradient(ellipse 80% 80% at 50% 50%, black 40%, transparent 100%);
}
/* Floating particles canvas */
#particles-canvas{position:absolute;inset:0;z-index:1;pointer-events:none;}

.hero-inner{max-width:1200px;margin:0 auto;padding:0 clamp(20px,5vw,60px);display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:60px;position:relative;z-index:2;width:100%;}
.hero-badge{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:30px;background:rgba(124,58,237,.10);border:1px solid rgba(124,58,237,.22);font-size:.82rem;font-weight:600;color:var(--accent);margin-bottom:20px;animation:fade-up .7s ease both;}
.hero-badge .dot{width:7px;height:7px;border-radius:50%;background:var(--accent2);animation:blink 1.4s ease infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.hero-heading{font-family:var(--font-display);font-size:clamp(2.6rem,5.5vw,5rem);font-weight:800;line-height:1.06;letter-spacing:-.03em;animation:fade-up .8s .1s ease both;}
.hero-heading .grad{background:linear-gradient(135deg,var(--accent) 0%,var(--accent2) 60%,#a78bfa 100%);-webkit-background-clip:text;background-clip:text;color:transparent;}
.hero-sub{font-size:clamp(.95rem,2vw,1.15rem);color:var(--txt2);line-height:1.7;margin:20px 0 32px;animation:fade-up .8s .2s ease both;}
#typed-text{color:var(--accent2);font-weight:600;border-right:2px solid var(--accent2);animation:blink-cursor .75s step-end infinite;}
@keyframes blink-cursor{50%{border-color:transparent}}
.hero-cta{display:flex;gap:14px;flex-wrap:wrap;animation:fade-up .8s .3s ease both;}
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:40px;animation:fade-up .8s .4s ease both;}
.stat-card{background:var(--glass);border:1px solid var(--glass-border);backdrop-filter:blur(12px);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow);transition:transform .3s var(--transition),box-shadow .3s;}
.stat-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);}
.stat-num{font-family:var(--font-display);font-size:2rem;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;}
.stat-label{font-size:.8rem;color:var(--txt3);font-weight:500;margin-top:2px;}

/* Hero right — clean avatar, no orbit rings */
.hero-right{display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;animation:fade-up .9s .15s ease both;}
.hero-avatar-wrap{position:relative;width:300px;height:300px;}
/* Single subtle glow border instead of spinning orbit */
.avatar-glow-ring{
  position:absolute;inset:-6px;border-radius:50%;
  background:linear-gradient(135deg,rgba(124,58,237,.35),rgba(6,182,212,.35),rgba(167,139,250,.35));
  filter:blur(14px);
  animation:glow-breathe 4s ease-in-out infinite;
}
@keyframes glow-breathe{0%,100%{opacity:.6;transform:scale(1);}50%{opacity:1;transform:scale(1.04);}}
.hero-avatar{width:100%;height:100%;border-radius:50%;overflow:hidden;border:3px solid rgba(255,255,255,.15);box-shadow:0 12px 48px rgba(124,58,237,.28),0 0 0 1px rgba(124,58,237,.15);background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:6rem;font-weight:800;color:#fff;letter-spacing:-.05em;position:relative;z-index:1;}
None

/* Section shared */
section{position:relative;overflow:hidden;}
.section-wrap{max-width:1200px;margin:0 auto;padding:100px clamp(20px,5vw,60px);}
.section-label{display:inline-flex;align-items:center;gap:8px;font-size:.78rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:12px;}
.section-label::before{content:'';display:block;width:24px;height:2px;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:2px;}
.section-title{font-family:var(--font-display);font-size:clamp(2rem,4vw,3.2rem);font-weight:800;letter-spacing:-.03em;line-height:1.1;margin-bottom:16px;}
.section-desc{font-size:1.05rem;color:var(--txt2);line-height:1.75;max-width:620px;}
.grad-text{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;}
.reveal{opacity:0;transform:translateY(36px);transition:opacity .8s ease,transform .8s ease;}
.reveal.visible{opacity:1;transform:translateY(0);}
.reveal-delay-1{transition-delay:.1s;} .reveal-delay-2{transition-delay:.2s;} .reveal-delay-3{transition-delay:.3s;} .reveal-delay-4{transition-delay:.4s;}

/* ── About ── */
#about{background:var(--bg2);}
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:center;margin-top:56px;}
.about-text p{color:var(--txt2);line-height:1.8;font-size:1.05rem;margin-bottom:20px;}
.about-highlights{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:32px;}
.highlight-item{display:flex;align-items:flex-start;gap:12px;padding:16px;border-radius:14px;background:var(--glass);border:1px solid var(--glass-border);backdrop-filter:blur(8px);transition:transform .3s var(--transition),box-shadow .3s;}
.highlight-item:hover{transform:translateY(-3px);box-shadow:var(--shadow);}
.highlight-icon{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0;}
.highlight-text h4{font-size:.9rem;font-weight:700;margin-bottom:2px;}
.highlight-text p{font-size:.8rem;color:var(--txt3);line-height:1.5;margin:0;}
.about-visual{display:flex;flex-direction:column;gap:16px;}
.info-card{background:var(--glass);border:1px solid var(--glass-border);backdrop-filter:blur(16px);border-radius:var(--radius);padding:28px;box-shadow:var(--shadow);transition:transform .3s var(--transition),box-shadow .3s;}
.info-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);}
.info-card h3{font-family:var(--font-display);font-size:1.1rem;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:10px;}
.info-card h3 span{font-size:1.3rem;}
.info-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(124,58,237,.08);font-size:.88rem;color:var(--txt2);}
.info-row:last-child{border-bottom:none;}
.info-row strong{color:var(--txt);min-width:80px;}

/* ── Skills ── */
#skills{background:var(--bg);}
.skills-categories{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:56px;}
.skill-category{background:var(--glass);border:1px solid var(--glass-border);backdrop-filter:blur(16px);border-radius:var(--radius);padding:28px;box-shadow:var(--shadow);transition:transform .3s var(--transition),box-shadow .3s;position:relative;overflow:hidden;}
.skill-category::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent2));opacity:0;transition:opacity .3s;}
.skill-category:hover{transform:translateY(-6px);box-shadow:var(--shadow-lg);}
.skill-category:hover::before{opacity:1;}
.skill-cat-title{font-family:var(--font-display);font-size:1rem;font-weight:700;margin-bottom:20px;display:flex;align-items:center;gap:10px;}
.skill-cat-icon{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:.95rem;}
.skill-list{display:flex;flex-wrap:wrap;gap:8px;}
.skill-pill{padding:6px 14px;border-radius:30px;background:rgba(124,58,237,.08);border:1px solid rgba(124,58,237,.15);font-size:.82rem;font-weight:600;color:var(--accent);transition:all .2s;}
.skill-pill:hover{background:var(--accent);color:#fff;box-shadow:0 4px 16px rgba(124,58,237,.4);transform:translateY(-2px);}
.skill-pill.amber{background:rgba(245,158,11,.08);border-color:rgba(245,158,11,.15);color:var(--accent3);}
.skill-pill.amber:hover{background:var(--accent3);color:#fff;box-shadow:0 4px 16px rgba(245,158,11,.4);}
.skill-pill.green{background:rgba(16,185,129,.10);border-color:rgba(16,185,129,.20);color:#10b981;}
.skill-pill.green:hover{background:#10b981;color:#fff;box-shadow:0 4px 16px rgba(16,185,129,.4);}
.skill-bars{margin-top:64px;max-width:680px;}
.skill-bar-row{margin-bottom:22px;}
.skill-bar-header{display:flex;justify-content:space-between;font-size:.88rem;font-weight:600;margin-bottom:8px;}
.skill-bar-track{height:7px;background:var(--bg3);border-radius:9px;overflow:hidden;}
.skill-bar-fill{height:100%;border-radius:9px;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width 1.2s cubic-bezier(.22,.68,0,1.1);box-shadow:0 0 8px rgba(124,58,237,.5);}

/* ── Projects ── */
#projects{background:var(--bg2);}
.projects-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:28px;margin-top:56px;}
.project-card{background:var(--glass);border:1px solid var(--glass-border);backdrop-filter:blur(18px);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);transition:transform .35s var(--transition),box-shadow .35s;position:relative;}
.project-card:hover{transform:translateY(-8px) scale(1.01);box-shadow:var(--shadow-lg),0 0 40px rgba(124,58,237,.12);}
.project-thumb{height:180px;display:flex;align-items:center;justify-content:center;font-size:4rem;position:relative;overflow:hidden;}
.project-thumb::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,var(--accent),var(--accent2));opacity:.12;}
.project-thumb-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(124,58,237,.1) 1px,transparent 1px),linear-gradient(90deg,rgba(124,58,237,.1) 1px,transparent 1px);background-size:28px 28px;}
.project-emoji{position:relative;z-index:1;filter:drop-shadow(0 4px 12px rgba(0,0,0,.2));}
.project-body{padding:24px;}
.project-type{font-size:.75rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent2);margin-bottom:8px;}
.project-title{font-family:var(--font-display);font-size:1.2rem;font-weight:700;letter-spacing:-.02em;margin-bottom:10px;}
.project-desc{font-size:.88rem;color:var(--txt2);line-height:1.7;margin-bottom:16px;}
.tech-badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px;}
.tech-badge{padding:4px 10px;border-radius:6px;font-size:.75rem;font-weight:700;background:rgba(124,58,237,.1);border:1px solid rgba(124,58,237,.18);color:var(--accent);}
.project-links{display:flex;gap:10px;}
.proj-link{flex:1;padding:9px 0;text-align:center;border-radius:11px;font-size:.82rem;font-weight:700;transition:all .2s;}
.proj-link.gh{background:rgba(124,58,237,.1);border:1px solid rgba(124,58,237,.18);color:var(--accent);}
.proj-link.gh:hover{background:var(--accent);color:#fff;}
.proj-link.demo{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 4px 16px rgba(124,58,237,.3);}
.proj-link.demo:hover{box-shadow:0 8px 24px rgba(124,58,237,.5);transform:translateY(-2px);}

/* ── Education ── */
#education{background:var(--bg);}
.edu-timeline{margin-top:56px;position:relative;}
.edu-timeline::before{content:'';position:absolute;left:24px;top:0;bottom:0;width:2px;background:linear-gradient(to bottom,var(--accent),var(--accent2),transparent);}
.edu-item{display:flex;gap:32px;margin-bottom:36px;padding-left:60px;position:relative;}
.edu-dot{position:absolute;left:15px;top:22px;width:18px;height:18px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));border:3px solid var(--bg);box-shadow:0 0 0 3px rgba(124,58,237,.25);}
.edu-card{flex:1;background:var(--glass);border:1px solid var(--glass-border);backdrop-filter:blur(16px);border-radius:var(--radius);padding:28px;box-shadow:var(--shadow);transition:transform .3s var(--transition),box-shadow .3s;}
.edu-card:hover{transform:translateX(6px);box-shadow:var(--shadow-lg);}
.edu-year{font-size:.78rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:6px;}
.edu-degree{font-family:var(--font-display);font-size:1.15rem;font-weight:700;margin-bottom:4px;}
.edu-school{color:var(--txt2);font-size:.92rem;}
.edu-desc{color:var(--txt3);font-size:.85rem;margin-top:12px;line-height:1.6;}

/* ── Certifications ── */
#certifications{background:var(--bg2);}
.cert-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;margin-top:56px;}
.cert-card{background:var(--glass);border:1px solid var(--glass-border);backdrop-filter:blur(1
